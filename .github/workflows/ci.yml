name: ci

# Three gates, none of which need a model, a GPU or a network call. That is the
# point: the deterministic half of this toolkit is the half that can be checked
# by a machine, and it is checked on every push.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyYAML is the one dependency, used by the scorers. The tools themselves
      # are stdlib only, which is why this file installs nothing else.
      - name: install
        run: pip install pyyaml

      - name: no engagement material
        # A one-time scrub is undone by the next commit that pastes in a real
        # example. This is the gate that stops that, and it is first because a
        # leak is the only failure here that cannot be taken back.
        run: python3 check-clean.py

      - name: DESIGN references resolve
        # §1 names cross-reference rot as a motivating failure and this repo had
        # four of its own. sweep.py xref catches this in a client deliverable;
        # nothing was pointing it here.
        run: python3 check-refs.py

      - name: unit tests
        run: python3 run-tests.py

      - name: the tests actually catch breakage
        # Mutates each covered function, confirms the named tests fail, restores.
        # A suite that passes against broken code is the failure mode worth
        # hunting, and it is the one that looks like success.
        run: python3 run-tests.py --mutate

      - name: every tool loads and answers --help
        run: |
          fail=0
          test -f denylist.txt || { echo "denylist.txt missing — the scrub cannot run"; exit 1; }
          # The .docx path had never run in CI: every fixture document is
          # Markdown, which takes freeze.py's plain-text fast path. Two bugs
          # survived in that gap. Exercise the real extractor, and assert it
          # writes no absolute path into the text it freezes.
          out=$(python3 extract.py fixtures/floodtwin/extractor-smoke.docx)
          echo "$out" | grep -q "Extractor smoke fixture" || { echo "FAIL: extractor produced no text"; exit 1; }
          echo "$out" | grep -q "$(pwd)" && { echo "FAIL: absolute path in extracted text"; exit 1; }
          python3 extract.py fixtures/floodtwin/README.md >/dev/null 2>&1 && { echo "FAIL: unreadable source exited 0"; exit 1; }
          echo "extractor: text produced, no absolute path, unreadable source refused"
          # --help is not exercise. to-html.py crashed on EVERY input from the
          # moment rows started carrying __row__ -- it built its column list from
          # whatever keys it saw and called .strip() on an int -- and the gate
          # above reported it healthy for as long as that was true, because it
          # only ever asked the tool to describe itself. Run one consumer against
          # real data, in both formats it accepts.
          python3 to-html.py --matrix fixtures/floodtwin/comments.csv \
            --sheet Comments --out /tmp/ft.html
          grep -q "FT-003" /tmp/ft.html || { echo "FAIL: no rows rendered"; exit 1; }
          grep -q "__row__" /tmp/ft.html && { echo "FAIL: bookkeeping key rendered as a column"; exit 1; }
          echo "consumer: delimited register read, rendered, no bookkeeping leak"
          # This loop used to check only the exit status, so a tool "answered"
          # --help by ignoring it, running, and exiting 0. Four did: two ran their
          # gate instead of describing it, and two are libraries with no CLI at
          # all. Require actual help text from anything that claims to be a tool,
          # and check the libraries by importing them, which is the only claim
          # they make.
          python3 -c "import sys; sys.path.insert(0,'.'); import llm, vocabulary" \
            || { echo "FAIL: llm.py / vocabulary.py do not import"; fail=1; }
          for f in *.py dossier; do
            case "$f" in llm.py|vocabulary.py) continue ;; esac
            out=$(python3 "$f" --help 2>&1) || { echo "FAIL: $f --help exited non-zero"; fail=1; continue; }
            [ ${#out} -ge 40 ] || { echo "FAIL: $f --help printed ${#out} chars, not help"; fail=1; }
          done
          exit $fail

      - name: deterministic review runs with no model
        # The thirty-second demo the README opens with. If this breaks, the
        # first thing a stranger tries is the thing that fails.
        run: |
          ./dossier review fixtures/floodtwin \
            --doc deliverable-v2 --against deliverable-v1

      - name: corpus is frozen and has not drifted
        run: python3 freeze.py --project fixtures/floodtwin --check

      - name: scorer reproduces the committed reference run
        # Scores committed artefacts, not fresh inference, so it measures the
        # scorer rather than whatever model happens to be reachable.
        run: |
          python3 score.py --project fixtures/floodtwin \
            --coverage cov-embed-12.csv --min 0.75
