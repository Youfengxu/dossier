# Ground truth for the floodtwin fixture.
#
# Every planted defect, and — as importantly — every planted DECOY. A fixture
# that scores only recall trains tools to flag everything; the decoys are what
# make precision measurable.
#
# `anchor` is an exact substring of the named document, so entries stay valid
# when line numbers move. `absent: true` means the defect IS the absence, so
# there is nothing to anchor to.
#
# expect:
#   defect      — a correct tool reports this
#   not_a_defect — a correct tool does NOT report this; reporting it is a false positive

fixture: floodtwin
version: 1

documents:
  requirements:   requirements.md
  deliverable-v1: deliverable-v1.md
  deliverable-v2: deliverable-v2.md      # generated by make-v2.py

# ---------------------------------------------------------------------------
# D1 — coverage gaps: an obligation the deliverable never discharges
# ---------------------------------------------------------------------------
defects:
  - id: GT-D1-001
    class: D1
    obligation: R-021
    document: deliverable-v1
    absent: true
    title: No trade-off analysis for any subsystem
    expect: defect
    notes: >
      R-021 requires options considered and basis for selection, per subsystem.
      Nothing in the deliverable records either. Appendix D claims otherwise —
      see GT-D3-002.

  - id: GT-D1-002
    class: D1
    obligation: R-022
    document: deliverable-v1
    absent: true
    title: No maturity assessment against any declared scale
    expect: defect
    notes: Compounded by two false evidence claims, GT-D3-001 and GT-D3-003.

  - id: GT-D1-003
    class: D1
    obligation: R-003
    document: deliverable-v1
    anchor: "Interfaces to their\nsystems are out of scope for this revision."
    title: Evacuation decision support declared out of scope
    expect: defect
    notes: >
      R-003 requires the architecture to SUPPORT evacuation decision support as
      a consumer. Declaring the interface out of scope does not discharge it.
      A component-level reader sees a scope statement, not an unmet obligation —
      this one only surfaces against the requirements side.

  - id: GT-D1-004
    class: D1
    obligation: R-001
    document: deliverable-v1
    absent: true
    title: MVP geography never stated
    expect: defect
    related: [GT-D9-001]

# ---------------------------------------------------------------------------
# D2 — dangling obligations: a deferral or pointer that resolves nowhere
# ---------------------------------------------------------------------------
  - id: GT-D2-001
    class: D2
    obligation: R-041
    document: deliverable-v1
    anchor: "selections remain open under\nCAL-G-07"
    title: CAL-G-07 referenced but never defined
    expect: defect
    notes: The calibration register defines CAL-G-01 through CAL-G-05 only.

  - id: GT-D2-002
    class: D2
    obligation: R-041
    document: deliverable-v1
    anchor: "status definitions are in Section 14 and Appendix F"
    title: Appendix F cited; no Appendix F exists
    expect: defect
    notes: Appendices run A to D.

  - id: GT-D2-003
    class: D2
    obligation: R-011
    document: deliverable-v1
    anchor: "specified under IF-PA-014"
    title: IF-PA-014 referenced but absent from the interface catalogue
    expect: defect
    notes: R-011 requires every interface to appear in the consolidated catalogue.

# ---------------------------------------------------------------------------
# D3 — untrue self-claims: the document asserting evidence it does not hold
# ---------------------------------------------------------------------------
  - id: GT-D3-001
    class: D3
    obligation: R-024
    document: deliverable-v1
    anchor: "Component maturity is assessed in Section 9."
    title: Section 9 claims maturity is assessed in Section 9
    expect: defect
    notes: >
      Self-referential and false — Section 9 is deployment topology and contains
      no maturity content. Cheap to detect, hard to defend.

  - id: GT-D3-002
    class: D3
    obligation: R-024
    document: deliverable-v1
    anchor: "Trade-off analyses for each subsystem are recorded in Appendix C."
    title: Appendix D points trade-offs at the interface catalogue
    expect: defect

  - id: GT-D3-003
    class: D3
    obligation: R-024
    document: deliverable-v1
    anchor: "Component\nmaturity assessments are recorded in Section 9."
    title: Appendix D repeats the false maturity claim
    expect: defect

# ---------------------------------------------------------------------------
# D4 — undefined quantity with neither value nor named owner
# ---------------------------------------------------------------------------
  - id: GT-D4-001
    class: D4
    obligation: R-015
    document: deliverable-v1
    anchor: "damped by the stability\n   factor k"
    title: Stability factor k has no value, no owner, and no register entry
    expect: defect
    notes: >
      The contrast case for DC-005. k appears in no gap register and in no
      not-defined register, so it is a SILENT omission rather than a disclosed
      gap — which per RFO Annex A is the more serious of the two.

# ---------------------------------------------------------------------------
# D5 — dual binding: one slot, two occupants, no rule
# ---------------------------------------------------------------------------
  - id: GT-D5-001
    class: D5
    obligation: R-013
    document: deliverable-v1
    anchor: "No component may modify\na frozen schedule."
    title: Runtime Orchestrator and Alerting Service both own execution order
    expect: defect
    corroborating_anchors:
      - "The Alerting Service determines the evaluation order for pending alerts"
      - "AS reorders the frozen execution order by candidate severity"
    notes: >
      Section 5.2 declares RO authoritative and forbids modification of a frozen
      schedule; Section 8.4 and Algorithms step 3 have AS reorder exactly that.
      The three statements are individually coherent and mutually incompatible —
      no single passage looks wrong, which is what makes this class hard.

# ---------------------------------------------------------------------------
# D6 — ownership gap: every component defers to another
# ---------------------------------------------------------------------------
  - id: GT-D6-001
    class: D6
    obligation: R-012
    document: deliverable-v1
    absent: true
    title: Sensor disagreement resolution has no owner — a three-way deferral cycle
    lines: [113, 194]        # the three deferral legs: SF 6.3, HM 7.2, AS 8.3
    # Added so the entry is auto-scorable. The span is the line range of the
    # three sections this entry's own notes name, not the range where any tool
    # happened to fire — a defect with no anchor still has a location.
    expect: defect
    corroborating_anchors:
      - "defers resolution to the Hydrology Model"
      - "refers the disagreement to the Alerting\nService"
      - "and the\nSensor Fabric is authoritative for it."
    notes: >
      SF defers to HM, HM refers to AS, AS returns it to SF. The cycle closes
      and the capability is unowned. Detectable as a graph property, not by
      reading any one section.

# ---------------------------------------------------------------------------
# D7 — silent regression between revisions
# ---------------------------------------------------------------------------
  - id: GT-D7-001
    class: D7
    obligation: R-020
    document: deliverable-v2
    title: Not-defined register deleted wholesale
    expect: defect
    measure: {identifier: "ND-", v1: 8, v2: 0}

  - id: GT-D7-002
    class: D7
    obligation: R-020
    document: deliverable-v2
    title: Sensor Fabric gap register deleted, heading retained
    expect: defect
    measure: {identifier: "SF-G", v1: 7, v2: 0}
    notes: The heading survives, so a table of contents diff shows nothing.

  - id: GT-D7-003
    class: D7
    obligation: R-020
    document: deliverable-v2
    title: Hydrology Model gap register deleted, heading retained
    expect: defect
    measure: {identifier: "HM-G", v1: 5, v2: 0}

  - id: GT-D7-004
    class: D7
    obligation: R-023
    document: deliverable-v2
    title: Risk register removed; R-023 met in v1 and unmet in v2
    expect: defect
    measure: {identifier: "RSK-", v1: 5, v2: 0}

  - id: GT-D7-005
    class: D7
    obligation: R-020
    document: deliverable-v2
    title: Six sections renamed from "Risks and open decisions" with bodies unchanged
    expect: defect
    measure: {term: "risk", v1: 9, v2: 0, case_insensitive: true}
    notes: >
      The renaming is the tell. Byte-identical bodies under a heading that no
      longer says "risk" removes the word from the document without removing
      any content — invisible to a prose diff, obvious to a heading diff.

  - id: GT-D7-006
    class: D7
    obligation: R-024
    document: deliverable-v2
    title: Appendix D removed
    expect: defect
    notes: >
      Removes the false evidence claims GT-D3-002 and GT-D3-003 as a side
      effect. A tool that only diffs findings would score v2 as improved.

  - id: GT-D7-007
    class: D2
    obligation: R-041
    document: deliverable-v2
    anchor: "status definitions are in Section 14"
    title: Section 14 pointer dangles once the register is deleted
    expect: defect
    notes: Emergent — a consequence of GT-D7-001, not separately planted.

# ---------------------------------------------------------------------------
# D8 — orphan workstream: machinery with no downstream consumer
# ---------------------------------------------------------------------------
  - id: GT-D8-001
    class: D8
    obligation: R-030
    document: deliverable-v1
    anchor: "It produces a four-dimensional calibration vector per reach"
    title: Calibration vector has no decision-time consumer
    expect: defect
    corroborating_anchors:
      - "Alerting uses fixed thresholds held in service configuration."
    notes: >
      CP fits a 4-D vector per reach; AS evaluates against fixed configured
      thresholds; no interface in Appendix C carries the vector anywhere. The
      entire calibration workstream is unreachable from the decision path.
      This is the framing-error class: nothing is internally inconsistent, the
      work simply serves a purpose the design no longer has.

# ---------------------------------------------------------------------------
# D9 — vocabulary gap: purpose-bearing requirement terms absent
# ---------------------------------------------------------------------------
  - id: GT-D9-001
    class: D9
    obligation: R-001
    document: deliverable-v1
    term: "Port Meridian"
    expected_count: 0
    title: The city the MVP is scoped to is never named
    expect: defect
    notes: No synonym anywhere; the deliverable says "the metropolitan area".

  - id: GT-D9-002
    class: D9
    obligation: R-003
    document: deliverable-v1
    term: "evacuation"
    expected_count: 0
    title: Evacuation never appears
    expect: defect
    related: [GT-D1-003]

# ---------------------------------------------------------------------------
# E — editorial: identifier grammar inconsistency
# ---------------------------------------------------------------------------
  - id: GT-E-001
    class: E
    document: deliverable-v1
    anchor: "CAL-G-01"
    title: Calibration gaps numbered CAL-G-01 while every other class uses SF-G01 form
    expect: defect
    notes: >
      Low severity as a finding, high severity as a trap. A closure-checking
      pattern of the form [A-Z]{2,4}-G\d+ silently misses all five calibration
      gaps. This exact defect was found in a live review and defeated the
      first version of sweep.py.

# ---------------------------------------------------------------------------
# DECOYS — must NOT be reported. These measure precision.
# ---------------------------------------------------------------------------
decoys:
  - id: DC-001
    class: D9
    document: deliverable-v1
    term: "rainfall intensity"
    expected_count: 0
    title: Absent term, but covered by a synonym
    expect: not_a_defect
    notes: >
      R-002 uses "rainfall intensity"; the deliverable says "precipitation rate"
      throughout. Zero occurrences, fully addressed. The lexicon must carry the
      synonym pair or this becomes a false positive.

  - id: DC-002
    class: D9
    document: deliverable-v1
    term: "tidal surge"
    expected_count: 0
    title: Absent term, covered as "coastal overtopping"
    expect: not_a_defect

  - id: DC-003
    class: D4
    document: deliverable-v1
    anchor: "carries a state vector s(i,t), defined below."
    title: State vector appears undefined; the enumeration is on the next line
    expect: not_a_defect
    notes: >
      The trap that a keyword count walks straight into. An absence claim here
      would be rebutted by reading one line further. This is the fixture's
      direct analogue of the x(i,j,t) error in the real review.

  - id: DC-004
    class: D6
    document: deliverable-v1
    term: "eactivation"
    title: Reactivation appears unmodelled to a shallow read; it is exogenous by design
    expect: not_a_defect
    notes: >
      Four occurrences describing it as an observed exogenous event with defined
      consequences. Exogenous is not absent. The correct finding, if any, is a
      narrower question about the revalidation window (SF-G06), not a claim that
      the lifecycle is unmodelled.

  - id: DC-005
    class: D4
    document: deliverable-v1
    anchor: "The surge\nthreshold θ_surge governs emission"
    title: Threshold with no value, but disclosed with a named owner
    expect: not_a_defect
    notes: >
      R-015 permits a value OR a named owner. θ_surge carries both ND-02 and
      AS-G01 with an owner, so the obligation is met. Contrast GT-D4-001, where
      k has neither. RFO Annex A is explicit that a disclosed gap outranks a
      silent omission — a tool that flags both equally has misread the standard.

  - id: DC-006
    class: D2
    document: deliverable-v1
    anchor: "IF-RO-001 is the tick advancement signal"
    title: Identifiers appearing once, but defined in place
    expect: not_a_defect
    notes: >
      IF-RO-001 and IF-RO-002 appear only in Appendix C, where they are defined.
      A "referenced exactly once implies dangling" heuristic flags them. Singleton
      is a prior for a dangling reference, never a verdict.

# ---------------------------------------------------------------------------
# EXPECTED COVERAGE — the correct verdict for EVERY obligation, not just the
# defective ones. Without this only recall is measurable: you can tell whether a
# tool found the planted defects, but not whether it also flagged twelve things
# that were fine. Keyed by the requirement number in requirements.md; atomic
# obligations derived from one requirement are aggregated to their worst verdict.
#
# GROUND TRUTH IS A HYPOTHESIS, NOT AN ORACLE. Two entries here were corrected
# after the tool disagreed with them and turned out to be right. When tool and
# ground truth disagree, adjudicate against the obligation text — do not assume
# the tool is wrong, and do not edit ground truth merely to flatter a score. Each
# correction below carries its reasoning so the change can be challenged.
#
# "flagged" (unmet/partial/unverifiable) vs "clean" (met) is the decision that
# actually matters — exact-verdict agreement is reported too, but a partial where
# unmet was expected is a nuance, not an error.
  - id: DC-007
    class: D1
    document: deliverable-v1
    anchor: "an analyst wanting them consults\nthe state log directly."
    title: Alert inputs absent from the report, but present in stored state
    expect: not_a_defect
    notes: >
      R-071 asks that alerts be reconstructable from STORED STATE, not from the
      report. 19.2 says plainly that the inputs live in the state log. A reader
      who stops at "not carried into the report" calls this unmet.

  - id: DC-008
    class: D9
    document: deliverable-v1
    term: "rainfall"
    expected_count: 0
    title: Absent term, covered by "precipitation rate" in Section 24
    expect: not_a_defect

  - id: DC-009
    class: D5
    document: deliverable-v1
    anchor: "Reporting produces the RunSummary"
    title: Two components act on RunSummary, but with different verbs
    expect: not_a_defect
    notes: >
      Reporting PRODUCES the RunSummary; Authority operations EVALUATES it.
      Different actions on the same object are complementary, not competing — a
      handoff, which is how architectures are supposed to work. A detector that
      groups authority by the OBJECT alone reports this as a dual binding. Found
      on a real architecture, where "Runtime returns AgentTurnResult" and
      "Orchestrator evaluates AgentTurnResult" were flagged as a conflict; this
      is the fixture case that makes the fix measurable.

# ---------------------------------------------------------------------------
expected_coverage:
  deliverable-v1:
    R-001: unmet      # MVP geography never named
    R-002: met        # both scenarios covered — under synonyms (DC-001, DC-002)
    R-003: unmet      # evacuation support declared out of scope
    R-004: met        # read-only access, no write path proposed
    R-010: met        # components, responsibilities and interfaces identified
    R-011: unmet      # IF-PA-014 referenced, absent from the catalogue
    R-012: unmet      # no arbitration rule; disagreement ownership cycles
    R-013: partial    # CORRECTED after adjudication. The obligation has two
                      # limbs: which component is authoritative AND under what
                      # conditions. The deliverable states the first and never
                      # the second, so partial is right and the original 'met'
                      # was my error, not the tool's. (Separately, the D5
                      # contradiction in GT-D5-001 is invisible to coverage —
                      # that needs the claim index, not this verdict.)
    R-014: partial    # wall-clock relationship stated, SI units never declared
    R-015: partial    # theta_surge has a named owner; stability factor k has none
    R-020: met        # registers carry id, owner and closure evidence
    R-021: unmet      # no trade-off analysis anywhere
    R-022: unmet      # no maturity assessment
    R-023: met        # Appendix B risk register, owners and mitigations
    R-024: unmet      # Appendix D evidence claims are false
    R-030: unmet      # calibration vector has no decision-time consumer
    R-031: partial    # inputs declared, but the threshold value is not
    R-032: partial    # CORRECTED after adjudication. The obligation asks HOW
                      # calibration is refreshed; 10.3 states WHEN — on a new
                      # event or annually. Cadence is not method.
    R-040: met        # single document, numbered sections and appendices
    R-041: unmet      # Appendix F and CAL-G-07 resolve nowhere
    R-042: met        # permissive; Appendix A states the mapping
    # --- added when the fixture was grown (sections 3.6-3.11) ---------------
    R-050: partial    # 21.1 lists stores and owners; retention only for the
                      # telemetry archive, and that one is an open gap
    R-051: unmet      # personal vs aggregate telemetry never distinguished
    R-052: unmet      # 21.3 defers deletion behaviour to the delivery plan —
                      # a POINTER, not a description. Tests DESIGN 3.13.
    R-053: unmet      # cannot hold, since retention is open and personal
                      # telemetry is not identified
    R-070: met        # Section 18 describes deterministic replay
    R-071: met        # 19.2 says inputs are not in the report but ARE in the
                      # state log, which is what the obligation asks for.
                      # A shallow read calls this unmet — decoy DC-007.
    R-072: unmet      # 18.3 defers the comparison method to the delivery plan
    R-080: met        # 17.1 versioned scenario definitions
    R-081: partial    # inputs declared; expected outputs explicitly not held
    # R-082 is a MAY — permissive, excluded from coverage by design (3.15)
    # R-090..R-093 are roadmap-scoped. They are deliberately NOT listed here:
    # judged against the architecture they would all read unmet, which is the
    # false-positive class that --scope exists to remove. They become scoreable
    # once the fixture requirements are extracted in chunk mode with scopes.


# ---------------------------------------------------------------------------
scoring:
  # A tool run is scored against this file. Both numbers matter; recall alone
  # is trivially maximised by reporting everything.
  recall:    found_defects / total_defects
  precision: found_defects / (found_defects + reported_decoys)
  totals:
    defects: 24
    decoys: 9
