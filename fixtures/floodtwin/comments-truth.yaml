# Ground truth for the floodtwin comment matrix.
#
# Two questions, deliberately kept apart, because they are the pair most often
# conflated and they disagree on this fixture:
#
#   satisfied_v2 — does deliverable-v2 as it stands satisfy the comment?
#   changed      — did anything move between v1 and v2 for this comment?
#
# A row can be `satisfied_v2: met` with `changed: none` — the deliverable already
# answered it, and a diff-based tool sees nothing. A row can be `changed: cosmetic`
# with `satisfied_v2: not_met` — something moved and it was not the substance.
# FT-003 is that case and is the most important row here.
#
# v2 is a REGRESSION of v1, generated by make-v2.py, so several comments are
# worse served after the revision than before. That is deliberate: a fixture where
# every revision improves things cannot test a vendor's claim.

fixture: floodtwin-comments
version: 1
matrix: comments.csv
documents:
  reviewed: deliverable-v1        # what the reviewer read when writing comments
  response: deliverable-v2        # what the vendor supplied as the revision

comments:
  FT-001:
    satisfied_v2: met
    changed: none
    why: >-
      6.3 already states the precedence rule — the fabric defers resolution to the
      Hydrology Model. Satisfied by standing text, untouched by the revision. A
      diff-only tool reports "not addressed" and is wrong.
  FT-002:
    satisfied_v2: not_met
    changed: none
    why: Tick duration is carried in the not-defined register; no value is given in either revision.
  FT-003:
    satisfied_v2: not_met
    changed: cosmetic
    claim_supported: false
    why: >-
      THE KEY ROW. The comment asked the section to address implementation
      constraints. v2 renames the heading to exactly those words and leaves the body
      byte-identical — still a gap register. The vendor's action reads as compliance,
      the diff shows a change, and the substance did not move.
  FT-004:
    satisfied_v2: not_met
    changed: substantive
    claim_supported: false
    why: >-
      Asked for closure dates. v2 deleted the constraints table entirely and left the
      heading, so the section still looks present. Worse after the revision, and the
      action column says only "Updated".
  FT-005:
    satisfied_v2: not_met
    changed: substantive
    claim_supported: false
    why: >-
      Asked for constraints enumerated individually. v2 replaced the table with a
      single sentence deferring to the delivery plan — the opposite of the request.
      "Revised in the new document" is literally true and substantively contrary.
  FT-006:
    satisfied_v2: not_met
    changed: substantive
    claim_supported: false
    why: Appendix B deleted wholesale. "Risk register updated" describes a register that no longer exists.
  FT-007:
    satisfied_v2: not_met
    changed: substantive
    claim_supported: false
    why: >-
      Section 14 deleted. The open items were not closed; the register that disclosed
      them was removed. "Reviewed and addressed" is the claim this fixture exists to test.
  FT-008:
    satisfied_v2: not_met
    changed: substantive
    why: Appendix D deleted; evidence locations can no longer be confirmed at all.
  FT-009:
    satisfied_v2: not_met
    changed: substantive
    why: >-
      CHANGED, BUT NOT FOR THIS REASON. Section 1 did move between revisions — the
      version string was bumped — so a diff-based tool sees activity and may read it
      as a response. The comment is untouched by that edit: Section 1 still points at
      Section 14, which v2 deleted, so the cross-reference now dangles. The defect is
      emergent, caused by a deletion elsewhere, and no amount of section-scoped
      diffing surfaces it.
  FT-010:
    satisfied_v2: not_met
    changed: none
    why: 8.2 names a threshold but gives neither value nor units; the symbol is in the not-defined register.
  FT-011:
    satisfied_v2: met
    changed: none
    why: >-
      5.2 assigns scheduling authority to exactly one component in bold, and forbids
      modification of a frozen schedule. Satisfied by standing text. Second decoy.
  FT-012:
    satisfied_v2: not_met
    changed: none
    why: Residual normalisation denominator is in the not-defined register and 7.3 does not supply it.
  FT-013:
    satisfied_v2: not_met
    changed: none
    claim_supported: false
    why: >-
      9 describes services, environments and scaling but never failure domains.
      "Addressed in the revision" is unsupported — that section is unchanged.
  FT-014:
    satisfied_v2: not_met
    changed: none
    why: Revalidation window is in the not-defined register; 10.2 gives the fitting method, not the window.

# Expected aggregates, for a test to assert against.
totals:
  comments: 14
  satisfied_v2_met: 2          # FT-001, FT-011 — both by standing text, neither by revision
  changed_none: 7
  changed_cosmetic: 1          # FT-003
  changed_substantive: 6
  claims_unsupported: 6        # rows whose vendor_action a diff does not support
