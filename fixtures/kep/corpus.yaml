# Real-scale corpus: Kubernetes Enhancement Proposals.
#
# The synthetic floodtwin fixture has an exact answer key and is the regression
# gate. This one has neither — what it has is SCALE, real extraction messiness,
# and a retrieval regime that matches a live engagement rather than a toy.
#
# Requirements side: the KEP template's Production Readiness Review
# questionnaire. It is a genuine requirements source — a list of questions a KEP
# MUST answer before it can graduate — written by people who had no idea it
# would be used this way.
#
# Deliverable side: KEP-2400 (node swap), pinned at two revisions eighteen
# months apart, so version diffing has a real target. KEP-1287 is a second,
# larger deliverable governed by the same questionnaire — which is exactly the
# one-requirements-source-many-deliverables shape that --scope exists for.
#
# Run ./fetch.py first; source/ is not committed.

